<text x="10" y="404" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="15" font-weight="bold" fill="#000000" text-anchor="start">Worst outage 15 ms = 33× inside DRDO's 500 ms window; bypass = the unmodified radio − 0.6 dB.</text>
<text x="10" y="430" font-family="Liberation Sans, Arial, Helvetica, sans-serif" font-size="14.5" font-weight="normal" fill="#333333" text-anchor="start" font-style="italic">Invariant, asserted every hop: active bundle tag = current hop frequency, or mode = BYPASS.</text>
